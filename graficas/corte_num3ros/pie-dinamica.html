<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts Bar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    #chart {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body> 
  <div id="chart"></div>

  <script>

    var option;
     var chart;

    chart = echarts.init(document.getElementById('chart'));

const data = [
  { value: 720, name: 'Administrativa' },
  { value: 252, name: 'Fiscal' },
  { value: 92, name: 'Municipal' },
  { value: 59, name: 'Constitucional' },
  { value: 138, name: 'Otros' }
];
const defaultPalette = [
  '#6D378C',
  '#61B73A',
  '#08205A',
  '#DA3296',
  '#FE360B',
  '#003041',
  '#659CC8',
  '#D6E4CA',
  '#3fbe95'
];
const radius = ['30%', '98%'];
const pieOption = {
  tooltip: {
    trigger: 'item',
    backgroundColor: '#1f2937', // fondo
    borderColor: '#60a5fa', // borde
    borderWidth: 1,
    textStyle: {
      color: '#ffffff', // color de letra
      fontSize: 18, // tamaño
      fontWeight: 'bold', // negrita
      fontFamily: 'Roboto'
    },
    formatter: function (params) {
      const total = data.reduce((s, d) => s + d.value, 0);
      return `
        <b>${params.name}</b><br/>
        Valor: ${params.value}<br/>
        ${((params.value / total) * 100).toFixed(1)}%
      `;
    }
  },
  series: [
    {
      color: [
        '#6D378C',
        '#61B73A',
        '#08205A',
        '#DA3296',
        '#FE360B',
        '#003041',
        '#659CC8',
        '#D6E4CA'
      ],
      type: 'pie',
      id: 'distribution',
      radius: radius,
      label: {
        show: false
      },
      universalTransition: true,
      animationDurationUpdate: 1000,
      data: data
    }
  ]
};
const parliamentOption = (function () {
  let sum = data.reduce(function (sum, cur) {
    return sum + cur.value;
  }, 0);
  let angles = [];
  let startAngle = -Math.PI / 2;
  let curAngle = startAngle;
  data.forEach(function (item) {
    angles.push(curAngle);
    curAngle += (item.value / sum) * Math.PI * 2;
  });
  angles.push(startAngle + Math.PI * 2);
  function parliamentLayout(startAngle, endAngle, totalAngle, r0, r1, size) {
    let rowsCount = Math.ceil((r1 - r0) / size);
    let points = [];
    let r = r0;
    for (let i = 0; i < rowsCount; i++) {
      // Recalculate size
      let totalRingSeatsNumber = Math.round((totalAngle * r) / size);
      let newSize = (totalAngle * r) / totalRingSeatsNumber;
      for (
        let k = Math.floor((startAngle * r) / newSize) * newSize;
        k < Math.floor((endAngle * r) / newSize) * newSize - 1e-6;
        k += newSize
      ) {
        let angle = k / r;
        let x = Math.cos(angle) * r;
        let y = Math.sin(angle) * r;
        points.push([x, y]);
      }
      r += size;
    }
    return points;
  }
  return {
    series: {
      type: 'custom',
      id: 'distribution',
      data: data,
      coordinateSystem: undefined,
      universalTransition: true,
      animationDurationUpdate: 1000,
      renderItem: function (params, api) {
        var idx = params.dataIndex;
        var viewSize = Math.min(api.getWidth(), api.getHeight());
        var r0 = ((parseFloat(radius[0]) / 100) * viewSize) / 2;
        var r1 = ((parseFloat(radius[1]) / 100) * viewSize) / 2;
        var cx = api.getWidth() * 0.5;
        var cy = api.getHeight() * 0.5;
        var size = viewSize / 50;
        var points = parliamentLayout(
          angles[idx],
          angles[idx + 1],
          Math.PI * 2,
          r0,
          r1,
          size + 3
        );
        return {
          type: 'group',
          children: points.map(function (pt) {
            return {
              type: 'circle',
              autoBatch: true,
              shape: {
                cx: cx + pt[0],
                cy: cy + pt[1],
                r: size / 2
              },
              style: {
                fill: defaultPalette[idx % defaultPalette.length]
              }
            };
          })
        };
      }
    }
  };
})();
let currentOption = (option = pieOption);
setInterval(function () {
  currentOption = currentOption === pieOption ? parliamentOption : pieOption;
  chart.setOption(currentOption);
}, 2000);

option && chart.setOption(option);


    window.addEventListener('resize', function () {
        if (chart) chart.resize();
    });

    
  </script>
</body>
</html>
