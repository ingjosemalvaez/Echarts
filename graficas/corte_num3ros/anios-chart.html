<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribución de los principales asuntos concluidos por año de ingreso a la SCJN</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    #chart {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body> 
  <div id="chart"></div>

  <script>

    var option;
    var chart;

    chart = echarts.init(document.getElementById('chart'));

    chart.setOption({
        grid: {
            left: '50%', // Reduce el margen izquierdo a 0 (o los píxeles que necesites)
            right: '0%',
        },
        tooltip: {
            trigger: 'axis',
            axisPointer: {
                // Use axis to trigger tooltip
                type: 'shadow' // 'shadow' as default; can also be 'line' or 'shadow'
            },
            textStyle: {
                fontFamily: 'Roboto',
                fontSize: 14,
                fontWeight: 'bold',
                fontStyle: 'normal',
                color: '#000000'
            }
        },
        legend: {
            orient: 'vertical',
            right: 10,
            top: 'center',
            //bottom: 0,
            textStyle: {
                fontFamily: 'Roboto',
                fontSize: 14,
                fontWeight: 'bold',
                fontStyle: 'normal',
                color: '#000000'
            }
        },
        xAxis: {
            type: 'value',
            axisLabel: {
                show: false
            },
            splitLine: {
                show: false // Hides the Y-axis grid lines
            }
        },
        yAxis: {
            type: 'category',
            axisLine: {
                lineStyle: {
                    width: 3,
                    color: '#000000'
                }
            },
            axisLabel: {
                interval: 0,
                fontSize: 14,
                fontFamily: 'Roboto',
                fontWeight: 'bold',
                color: '#000000'
            },
            axisTick: {
                show: false // Hides the small tick lines on the Y-axis
            },
            splitLine: {
                show: false // Hides the Y-axis grid lines
            },
            data: [
                'Amparo Directo en Revisión',                
                'Controversia Constitucional',
                'Solicitud de Ejercicio de la Facultad de Atracción',
                'Recurso de Reclamación',
                'Amparo en Revisión',
                'Acción de Inconstitucionalidad',
                'Contradicción de Criterios',
                'Recurso de Reclamación en la Controversia Constitucional',
                'Solicitud de Reasunción de Competencia',
                ]
        },
        series: [
            {
                color: '#DA3296',
                name: '2026',
                type: 'bar',
                stack: 'total',
                label: {
                    show: true,
                    // Default label styles
                    fontFamily: 'Roboto',
                    fontSize: 16,
                    fontWeight: 'bold',
                    fontStyle: 'normal',
                    color: '#000000'
                },
                emphasis: {
                    focus: 'series'
                },
                data: [107, 246, 308, 53, 90, 63, 67, 30, 50]
            },
            {
                color: '#61B73A',
                name: '2025',
                type: 'bar',
                stack: 'total',
                label: {
                    show: true,
                    // Default label styles
                    fontFamily: 'Roboto',
                    fontSize: 16,
                    fontWeight: 'bold',
                    fontStyle: 'normal',
                    color: '#000000'
                },
                emphasis: {
                    focus: 'series'
                },
                data: [346, 189, 182, 272, 176, 107, 104, 65, 45]
            },
            {
                color: '#659CC8',
                name: '2024',
                type: 'bar',
                stack: 'total',
                label: {
                    show: true,
                    // Default label styles
                    fontFamily: 'Roboto',
                    fontSize: 16,
                    fontWeight: 'bold',
                    fontStyle: 'normal',
                    color: '#000000'
                },
                emphasis: {
                    focus: 'series'
                },
                data: [64, 61, 6, 6, 33, 56, 14, 2, null]
            },
            {
                color: '#FE360B',
                name: '2023 - 2019',
                type: 'bar',
                stack: 'total',
                label: {
                    show: true,
                    // Default label styles
                    fontFamily: 'Roboto',
                    fontSize: 16,
                    fontWeight: 'bold',
                    fontStyle: 'normal',
                    color: '#000000'
                },
                emphasis: {
                    focus: 'series'
                },
                data: [29, 35, null, null, 23, 40, 9, null, null]
            }
        ]
    });

    //option && chart.setOption(option);

    window.addEventListener('resize', function () {
        if (chart) chart.resize();
    });

    
  </script>
</body>
</html>
