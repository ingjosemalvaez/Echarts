<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts Bar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    #chart {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body> 
  <div id="chart"></div>

  <script>

    var option;
    var chart;

    chart = echarts.init(document.getElementById('chart'));

    chart.setOption({
        series: [
            {
            type: 'treemap',
            breadcrumb: {
                show: false // Hides the bottom navigation/breadcrumb bar
            },
            label: {
                show: true,
                fontFamily: 'Roboto'
            },
            data: [
                {
                    name: 'Contribuiciones \n 16%',
                    value: 16,
                    itemStyle: { color: '#08205A' },
                    label: {
                        fontSize: 20,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Normas en materia\n penal / Sistema\n de justicia\n penal acusatorio \n 10%',
                    value: 10,
                    itemStyle: { color: '#659CC8' },
                    label: {
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Invasión de\n esferas\n competenciales\n 8%',
                    value: 8,
                    itemStyle: { color: '#6D378C' },
                    label: {
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Debido proceso 7%',
                    value: 7,
                    itemStyle: { color: '#FE360B' },
                    label: {
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Procedencia /\n trámite del\n juicio de amparo\n 5%',
                    value: 5,
                    itemStyle: { color: '#6D378C' },
                    label: {
                        fontSize: 14,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Justicia\n administrativa\n	5%',
                    value: 5,
                    itemStyle: { color: '#61B73A' },
                    label: {
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Seguridad social\n 5%',
                    value: 5,
                    itemStyle: { color: '#DA3296' },
                    label: {
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Acceso a la\n justicia\n 3%',
                    value: 3,
                    itemStyle: { color: '#FE360B' },
                    label: {
                        fontSize: 14,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Contratos\n administrativos,\n civiles y \nmercantiles\n 3%',
                    value: 3,
                    itemStyle: { color: '#08205A' },
                    label: {
                        fontSize: 12,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Cumplimiento\n de\n resoluciones\n y reparación\n del daño\n 3%',
                    value: 3,
                    itemStyle: { color: '#FFBA00' },
                    label: {
                        fontSize: 12,
                        fontWeight: 'bold',
                        //color: '#000000'
                    }
                },
                {
                    name: 'Distribución\n de \nrecursos y \ngasto público\n 2%',
                    value: 2,
                    itemStyle: { color: '#003041' },
                    label: {
                        fontSize: 12,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Proceso\n legislativo\n 2%',
                    value: 2,
                    itemStyle: { color: '#FFBA00' },
                    label: {
                        fontSize: 12,
                        fontWeight: 'bold'
                    }
                },
                {
                    name: 'Trabajo y\n justicia\n laboral\n 2%',
                    value: 2,
                    itemStyle: { color: '#659CC8' },
                    label: {
                        fontSize: 12,
                        fontWeight: 'bold'
                    }
                }
            ]
            }
        ]   
    });

    //option && chart.setOption(option);

    window.addEventListener('resize', function () {
        if (chart) chart.resize();
    });

    
  </script>
</body>
</html>
