<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts Bar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    #chart {
      width: 100%;
      height: 700px;
    }
  </style>
</head>
<body>
  <h1>Gráfica Rafa</h1>
  <div id="chart"></div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    chart.setOption({
     legend: {
            show: '',
            top: 'bottom'
        },
        toolbox: {
            show: true,
            feature: {
            mark: { show: true },
            dataView: { show: true, readOnly: false },
            restore: { show: true },
            saveAsImage: { show: true }
            }
        },
        series: [
            {
            color: [
                '#6D378C',
                '#61B73A',
                '#08205A',
                '#DA3296',
                '#FE360B',
                '#003041',
                '#659CC8',
                '#D6E4CA'
            ],
            label: {
                show: true,
                fontfamily: 'Roboto',
                fontSize: 18,
                fontWeight: 'bold',
                color: '#333'
            },
            labelLine: {
                show: true,
                lineStyle: {
                color: '#4F81BD',
                width: 5
                }
            },
            name: 'Nightingale Chart',
            type: 'pie',
            radius: [50, 250],
            center: ['50%', '50%'],
            roseType: 'area',
            itemStyle: {
                borderRadius: 8
            },
            data: [
                { value: 90, name: 'Administrativa 38.2%' },
                { value: 80, name: 'Penal 26.2%' },
                { value: 70, name: 'Civil 21.5%' },
                { value: 60, name: 'Trabajo 7.5%' },
                { value: 50, name: 'Agraria 2.3%' },
                { value: 40, name: 'Familiar 1.9%' },
                { value: 30, name: 'Fiscal 1.4%' },
                { value: 20, name: 'Otros 1%' }
            ]
            }
        ]
    });

    window.addEventListener('resize', () => chart.resize());
  </script>
</body>
</html>
